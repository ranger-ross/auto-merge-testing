name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simulate work (configurable delay)
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit: $(git log -1 --pretty=%H)"
          echo "Message: $COMMIT_MSG"

          # Default delay (seconds) when no marker is present
          DELAY=15

          # Parse [delay=N] / [delay=N s] / [delay: N] / [delay N] from commit message
          # Examples: [delay=0] [delay=30s] [delay: 60] [delay 10] — first match wins
          if echo "$COMMIT_MSG" | grep -qE '\[delay[=: ]*[0-9]+s?\]'; then
            EXTRACTED=$(echo "$COMMIT_MSG" | grep -oE '\[delay[=: ]*[0-9]+s?\]' | grep -oE '[0-9]+' | head -1)
            if [ -n "$EXTRACTED" ]; then
              DELAY="$EXTRACTED"
            fi
          fi

          # Clamp to 0–600s (10 min) to avoid accidental long waits
          if [ "$DELAY" -gt 600 ]; then
            echo "::warning::Delay $DELAY exceeds 600s cap — clamping to 600s"
            DELAY=600
          fi
          if [ "$DELAY" -lt 0 ]; then
            DELAY=0
          fi

          echo "Sleeping ${DELAY}s before result..."
          sleep "$DELAY"

          echo "Checking for [fail-ci] marker..."
          if echo "$COMMIT_MSG" | grep -q "\[fail-ci\]"; then
            echo "::error::Failing CI as requested via [fail-ci] in commit message"
            exit 1
          fi
          echo "✅ CI passed (delay was ${DELAY}s)"
